<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Latar pemandangan bukit hijau dan langit biru">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b67a3"/>
      <stop offset="0.42" stop-color="#5e9ed3"/>
      <stop offset="0.6" stop-color="#a8cfec"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb63a"/>
      <stop offset="1" stop-color="#55911f"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a9b1e"/>
      <stop offset="1" stop-color="#2f6a10"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.76" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#fff8d0" stop-opacity="0.75"/>
      <stop offset="0.3" stop-color="#fff3b8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veilLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04102e" stop-opacity="0.4"/>
      <stop offset="0.16" stop-color="#04102e" stop-opacity="0.22"/>
      <stop offset="0.3" stop-color="#04102e" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>

  <g filter="url(#soft2)" opacity="0.8">
    <ellipse cx="360" cy="230" rx="180" ry="42" fill="#ffffff" opacity="0.55"/>
    <ellipse cx="500" cy="260" rx="130" ry="30" fill="#ffffff" opacity="0.4"/>
  </g>
  <g filter="url(#soft)" opacity="0.75">
    <ellipse cx="1050" cy="190" rx="210" ry="46" fill="#ffffff" opacity="0.5"/>
    <ellipse cx="1250" cy="225" rx="150" ry="34" fill="#ffffff" opacity="0.35"/>
  </g>

  <path d="M0 560 C 260 522, 560 560, 880 548 C 1140 538, 1360 498, 1600 540 L 1600 1000 L 0 1000 Z" fill="url(#hillBack)"/>
  <path d="M0 566 C 300 540, 620 572, 920 556 C 1180 543, 1400 512, 1600 548 L 1600 575 C 1300 545, 1000 590, 700 590 C 420 590, 200 570, 0 590 Z" fill="#8fc24a" opacity="0.5"/>

  <path d="M-60 742 C 320 652, 880 716, 1660 618 L 1660 1000 L -60 1000 Z" fill="url(#hillFront)"/>
  <path d="M-60 748 C 360 664, 900 726, 1660 630 L 1660 668 C 980 762, 380 700, -60 800 Z" fill="#6bab26" opacity="0.45"/>

  <g opacity="0.5" fill="#2c5e0e">
    <ellipse cx="1150" cy="800" rx="260" ry="26" filter="url(#soft)"/>
    <ellipse cx="640" cy="880" rx="300" ry="30" filter="url(#soft)"/>
    <ellipse cx="1450" cy="930" rx="240" ry="26" filter="url(#soft)"/>
  </g>

  <rect width="1600" height="1000" fill="url(#veilLeft)"/>
</svg>
